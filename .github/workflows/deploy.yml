name: Build and Deploy WebGL

on:
  push:
    branches:
      - main
      - merge/461

jobs:
  # 1. 빌드 전용 Job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GYE_MONG_PLAY_TOKEN }}
          fetch-depth: 0

      - name: Cache Library folder (WebGL)
        uses: actions/cache@v4
        with:
          path: |
            Library/ShaderCache
            Library/ScriptAssemblies
          key: WebGL-Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            WebGL-Library-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.22f1
          targetPlatform: WebGL
          customParameters: -logFile - -ignoreCompilerErrors

      # 빌드 결과물을 아티팩트로 저장 (다음 Job에서 쓰기 위함)
      - name: Upload WebGL build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build-Files
          path: build/WebGL/WebGL

  # 2. 배포(Push) 전용 Job
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build-Files
          path: build-results

      - name: Push to another repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone https://x-access-token:${{ secrets.GYE_MONG_PLAY_TOKEN }}@github.com/Apptive-Game-Team/GyeMong_Play.git target_repo
          
          cd target_repo

          # 기존 파일 삭제
          rm -rf ./Build ./index.html ./TemplateData
          
          # 아티팩트에서 다운로드한 파일 복사
          cp -r ../build-results/* ./
          
          # 변경 사항 확인 및 푸시
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update WebGL build from main repo" && git push origin main)